<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SCRAPCRAFT — Junk Never Looked So Good</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a1a; overflow: hidden; font-family: 'Courier New', monospace; }
    #canvas-container { position: fixed; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; }

    /* ── HUD ── */
    #hud { position: fixed; inset: 0; pointer-events: none; }

    #crosshair {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: rgba(255,255,255,0.8); font-size: 20px; font-weight: bold;
    }

    #hotbar {
      position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 4px;
    }
    .hotbar-slot {
      width: 56px; height: 56px; border: 2px solid #555;
      background: rgba(0,0,0,0.65); display: flex; flex-direction: column;
      align-items: center; justify-content: center; position: relative;
      border-radius: 4px; transition: border-color 0.1s;
    }
    .hotbar-slot.active { border-color: #f0b429; box-shadow: 0 0 8px #f0b42988; }
    .hotbar-slot .item-icon { font-size: 22px; }
    .hotbar-slot .item-count {
      position: absolute; bottom: 2px; right: 5px;
      font-size: 10px; color: #fff; text-shadow: 1px 1px 0 #000;
    }
    .hotbar-slot .slot-num {
      position: absolute; top: 1px; left: 4px;
      font-size: 9px; color: #888;
    }

    #toolbar-hint {
      position: absolute; bottom: 88px; left: 50%; transform: translateX(-50%);
      color: #aaa; font-size: 11px; letter-spacing: 1px;
    }

    /* ── Quest / Foreman panel ── */
    #foreman-panel {
      position: absolute; top: 20px; right: 20px;
      width: 300px; pointer-events: auto;
    }
    #foreman-bubble {
      background: rgba(10,10,10,0.88); border: 2px solid #f0b429;
      border-radius: 8px; padding: 12px 14px; color: #f0f0f0;
      font-size: 13px; line-height: 1.5; display: none;
    }
    #foreman-bubble .name { color: #f0b429; font-weight: bold; margin-bottom: 4px; font-size: 14px; }
    #foreman-bubble .dismiss {
      margin-top: 8px; font-size: 11px; color: #888; cursor: pointer;
      pointer-events: auto; text-align: right;
    }
    #foreman-bubble .dismiss:hover { color: #f0b429; }

    #quest-box {
      margin-top: 8px; background: rgba(10,10,10,0.75);
      border: 1px solid #444; border-radius: 6px; padding: 10px 12px;
      font-size: 12px; color: #ccc; display: none;
    }
    #quest-box .quest-title { color: #f0b429; font-size: 13px; font-weight: bold; margin-bottom: 6px; }
    .quest-step { margin: 3px 0; }
    .quest-step.done { color: #4caf50; text-decoration: line-through; }

    /* ── Inventory / Crafting overlay ── */
    #overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.78);
      display: none; align-items: center; justify-content: center;
      pointer-events: auto; z-index: 100;
    }
    #overlay.open { display: flex; }

    #inv-panel {
      background: #1e1e1e; border: 2px solid #555;
      border-radius: 10px; padding: 20px; width: 720px; max-height: 90vh;
      overflow-y: auto; color: #e0e0e0;
    }
    #inv-panel h2 { color: #f0b429; font-size: 18px; margin-bottom: 16px; letter-spacing: 2px; }

    .panel-cols { display: flex; gap: 20px; }

    /* Inventory grid */
    #inv-grid { display: grid; grid-template-columns: repeat(9, 52px); gap: 4px; }
    .inv-slot {
      width: 52px; height: 52px; border: 1px solid #444;
      background: #111; border-radius: 4px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer; position: relative; transition: border-color 0.1s;
    }
    .inv-slot:hover { border-color: #f0b429; }
    .inv-slot .item-icon { font-size: 24px; }
    .inv-slot .item-count { position: absolute; bottom: 2px; right: 4px; font-size: 11px; color: #fff; text-shadow: 1px 1px 0 #000; }
    .inv-slot .item-name { font-size: 9px; color: #888; margin-top: 1px; text-align: center; line-height: 1.1; }

    /* Crafting section */
    #crafting-section { min-width: 280px; }
    #crafting-section h3 { color: #aaa; font-size: 13px; margin-bottom: 10px; letter-spacing: 1px; }
    #recipe-list { display: flex; flex-direction: column; gap: 6px; max-height: 480px; overflow-y: auto; }
    .recipe-card {
      background: #111; border: 1px solid #333; border-radius: 6px;
      padding: 8px 10px; cursor: pointer; transition: all 0.15s;
    }
    .recipe-card:hover { border-color: #f0b429; background: #1a1a00; }
    .recipe-card.craftable { border-color: #4caf5055; }
    .recipe-card.craftable:hover { border-color: #4caf50; background: #001a00; }
    .recipe-card .r-name { font-size: 13px; font-weight: bold; color: #e0e0e0; }
    .recipe-card .r-result { font-size: 11px; color: #aaa; margin-top: 2px; }
    .recipe-card .r-station { font-size: 10px; color: #888; margin-top: 2px; }
    .recipe-card .r-reqs { font-size: 10px; color: #888; margin-top: 4px; }
    .recipe-card .r-reqs span.ok { color: #4caf50; }
    .recipe-card .r-reqs span.missing { color: #f44336; }
    #craft-btn {
      margin-top: 12px; width: 100%; padding: 10px;
      background: #f0b429; color: #000; border: none; border-radius: 6px;
      font-family: inherit; font-size: 14px; font-weight: bold;
      cursor: pointer; letter-spacing: 1px; display: none;
    }
    #craft-btn:hover { background: #ffd060; }

    /* ── Tooltip ── */
    #tooltip {
      position: fixed; background: rgba(0,0,0,0.9); border: 1px solid #555;
      padding: 6px 10px; border-radius: 4px; font-size: 12px; color: #e0e0e0;
      pointer-events: none; display: none; z-index: 200; max-width: 200px;
    }
    #tooltip .t-name { color: #f0b429; font-weight: bold; }
    #tooltip .t-desc { color: #aaa; margin-top: 2px; }

    /* ── Block label ── */
    #block-label {
      position: absolute; bottom: 88px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.6); padding: 4px 12px; border-radius: 4px;
      font-size: 12px; color: #ddd; display: none; letter-spacing: 1px;
    }

    /* ── Notifications ── */
    #notifications {
      position: absolute; top: 20px; left: 20px;
      display: flex; flex-direction: column; gap: 6px; max-width: 260px;
    }
    .notif {
      background: rgba(0,0,0,0.8); border-left: 3px solid #f0b429;
      padding: 8px 12px; border-radius: 4px; font-size: 12px; color: #e0e0e0;
      animation: slideIn 0.2s ease, fadeOut 0.5s ease 3.5s forwards;
    }
    @keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: none; } }
    @keyframes fadeOut { to { opacity: 0; } }

    /* ── Start screen ── */
    #start-screen {
      position: fixed; inset: 0; background: #0d0d0d;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 1000; color: #e0e0e0;
    }
    #start-screen h1 {
      font-size: 64px; font-weight: 900; letter-spacing: 6px;
      color: #f0b429; text-shadow: 4px 4px 0 #8B5E00, 0 0 40px #f0b42955;
      margin-bottom: 8px;
    }
    #start-screen .tagline { color: #888; font-size: 14px; letter-spacing: 3px; margin-bottom: 40px; }
    #start-btn {
      padding: 14px 40px; background: #f0b429; color: #000; border: none;
      font-family: inherit; font-size: 16px; font-weight: bold; letter-spacing: 2px;
      cursor: pointer; border-radius: 6px; transition: all 0.2s;
    }
    #start-btn:hover { background: #ffd060; transform: scale(1.04); }
    #start-screen .controls-hint {
      margin-top: 32px; color: #555; font-size: 12px; line-height: 2;
      text-align: center;
    }
    #start-screen .controls-hint span { color: #888; }
  </style>
</head>
<body>
  <!-- Start Screen -->
  <div id="start-screen">
    <h1>SCRAPCRAFT</h1>
    <div class="tagline">JUNK NEVER LOOKED SO GOOD</div>
    <button id="start-btn">CLOCK IN</button>
    <div class="controls-hint">
      <span>WASD</span> Move &nbsp;|&nbsp; <span>MOUSE</span> Look &nbsp;|&nbsp; <span>E</span> Interact / Inventory<br>
      <span>LEFT CLICK</span> Mine &nbsp;|&nbsp; <span>RIGHT CLICK</span> Place &nbsp;|&nbsp; <span>1-9</span> Hotbar<br>
      <span>F</span> Talk to Foreman &nbsp;|&nbsp; <span>ESC</span> Close
    </div>
  </div>

  <!-- Game Canvas -->
  <div id="canvas-container"><canvas id="game-canvas"></canvas></div>

  <!-- HUD -->
  <div id="hud">
    <div id="crosshair">+</div>
    <div id="notifications"></div>

    <div id="block-label"></div>

    <div id="hotbar"></div>
    <div id="toolbar-hint">[ E ] INVENTORY &nbsp;|&nbsp; [ F ] FOREMAN &nbsp;|&nbsp; 1-9 HOTBAR</div>

    <div id="foreman-panel">
      <div id="foreman-bubble">
        <div class="name">🔧 BIG EARL</div>
        <div id="foreman-text"></div>
        <div class="dismiss" id="foreman-dismiss">[dismiss]</div>
      </div>
      <div id="quest-box">
        <div class="quest-title" id="quest-title"></div>
        <div id="quest-steps"></div>
      </div>
    </div>
  </div>

  <!-- Inventory/Crafting Overlay -->
  <div id="overlay">
    <div id="inv-panel">
      <h2>⚙ WORKSHOP</h2>
      <div class="panel-cols">
        <div>
          <div style="color:#aaa;font-size:12px;margin-bottom:8px;letter-spacing:1px;">INVENTORY</div>
          <div id="inv-grid"></div>
        </div>
        <div id="crafting-section">
          <h3>CRAFTING RECIPES</h3>
          <div id="recipe-list"></div>
          <button id="craft-btn">⚒ CRAFT</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Tooltip -->
  <div id="tooltip">
    <div class="t-name" id="tip-name"></div>
    <div class="t-desc" id="tip-desc"></div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
